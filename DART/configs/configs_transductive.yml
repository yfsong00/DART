cora:
  lr: 0.001
  lr_f: 0.01
  num_hidden: 512
  num_heads: 4
  num_layers: 2
  weight_decay: 2e-4
  weight_decay_f: 1e-4
  max_epoch: 1200
  max_epoch_f: 3500
  mask_rate: 0.5
  encoder: gat
  decoder: gat 
  activation: prelu
  in_drop: 0.2
  attn_drop: 0.1
  linear_prob: True
  loss_fn: sce 
  drop_edge_rate: 0.0
  optimizer: adam
  alpha_l: 3
  scheduler: True
  
  missing_rate: 0.9
  mask_type: uniform
  filling_method: feature_propagation
  num_iterations: 40

  train_edge_drop_rate: 0.1
  use_rec: True
  use_label_connect: True
  zero_fill: False
  seeds: [0, 1, 2, 3, 4]

