ogbn-arxiv:
  lr: 0.001
  lr_f: 0.01
  num_hidden: 1024
  num_heads: 4
  weight_decay: 0
  weight_decay_f: 5e-4
  max_epoch: 800
  max_epoch_f: 3500
  mask_rate: 0.75
  drop_edge_rate: 0.5
  num_layers: 3
  encoder: gcn
  decoder: gcn 
  activation: prelu
  in_drop: 0.2
  attn_drop: 0.1
  linear_prob: True
  loss_fn: sce
  alpha_l: 3 # 2
  scheduler: True
  norm: layernorm

  missing_rate: 0.90
  mask_type: structural
  filling_method: feature_propagation
  num_iterations: 40

  train_edge_drop_rate: 0.1
  use_rec: False
  use_label_connect: True
  zero_fill: False
  seeds: [0, 1, 2, 3, 4]

sailing:
  lr: 0.001
  lr_f: 0.005
  num_hidden: 512
  num_heads: 2
  weight_decay: 2e-4
  weight_decay_f: 0
  max_epoch: 1200
  # 最优的是 1500，2000 会有下降
  max_epoch_f: 15000
  # 目测 25000 应该能收敛
  mask_rate: 0.50
  num_layers: 3
  encoder: gat
  decoder: gat
  activation: prelu
  in_drop: 0.2
  loss_fn: sce
  optimizer: adam
  drop_edge_rate: 0.5
  alpha_l: 3
  norm: layernorm
  residual: True
  scheduler: True
  linear_prob: True

  missing_rate: 0.90
  mask_type: uniform
  filling_method: feature_propagation
  num_iterations: 40

  train_edge_drop_rate: 0.1
  use_rec: True
  use_label_connect: True
  zero_fill: False
  seeds: [0, 1, 2, 3, 4]